# Default configuration for Timer Service (Tsaheylu)
# These values can be overridden by environment-specific config files
# or by environment variables prefixed with TIMER_

[database]
# Default database URL - override with environment variable TIMER__DATABASE__URL
url = "postgresql://auth_admin:auth_admin@eywaos-eywadb-zmbyvn:5432/timer_db"

[auth]
# JWT Secret - MUST be overridden in production!
# Use: TIMER__AUTH__SECRET environment variable
secret = "dev_jwt_secret_change_me_in_production_at_least_64_chars_long!!!"

# JWT Issuer - defaults to eywa-auth-service
issuer = "eywa-auth-service"

[logging]
# Default log level
# Use: TIMER__LOGGING__LEVEL environment variable
level = "info"
