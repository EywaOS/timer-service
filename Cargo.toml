[package]
name = "timer-service"
version = "0.1.0"
edition = "2024"

[dependencies]

# Additional dependencies not re-exported by eywa-axum
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }
utoipa = { version = "5.4", features = ["axum_extras"] }
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unified Framework (re-exports: axum, tokio, serde, uuid, sea-orm, dotenvy, utoipa)

eywa-axum = { git = "https://github.com/EywaOS/eywa-axum" }

# Database migrations (service-specific)

migration = { path = "migration", package = "timer-service-migration" }

# Nota: axum è già re-exportato da eywa-axum, quindi la dipendenza diretta non serve

# Nota: sea-orm è già re-exportato da eywa-axum con le features giuste
