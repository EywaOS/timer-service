[package]
name = "timer-service"
version = "0.1.0"
edition = "2024"

[dependencies]

# Unified Framework (re-exports: axum, tokio, serde, chrono, uuid, sea-orm, dotenvy, utoipa, tracing-subscriber)

eywa-axum = { git = "https://github.com/EywaOS/eywa-axum" }

# Database migrations (service-specific)

migration = { path = "migration", package = "timer-service-migration" }

