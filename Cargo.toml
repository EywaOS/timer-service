[package]
name = "timer-service"
version = "0.1.0"
edition = "2024"

[dependencies]
eywa-axum = { git = "https://github.com/EywaOS/eywa-axum" }
migration = { path = "migration", package = "timer-service-migration" }

tokio = { version = "1.48.0", features = ["full"] }
serde = "1.0.228"
chrono = "0.4.39"
uuid = "1.11.0"
# Direct deps for macros (required by compiler even if re-exported)
sea-orm = { version = "1.1.19", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
dotenvy = "0.15"
axum = "0.8.8"
utoipa = "5.4.0"
tracing-subscriber = "0.3.18"
